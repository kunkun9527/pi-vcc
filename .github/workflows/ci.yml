name: CI

on:
  push:
    branches: [tom, "feat/**", "fix/**", "ci/**"]
  pull_request:
    branches: [tom, "feat/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: TypeScript
        run: bun run typecheck
      - name: Bun tests
        run: PI_FABRIC_COMPACTION_ENGINE= bun test ./tests --path-ignore-patterns '**/real-sessions.test.ts'
      - name: Regression tests
        run: bun run test:regression
